# One Laravel app, two hostnames (bezvahania.localhost, admin.bezvahania.localhost).
# Laravel itself separates the public site and the admin by host.
server {
    listen 80 default_server;
    server_name bezvahania.localhost admin.bezvahania.localhost;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files (public disk). Replaces the storage:link symlink, which is unreliable on a
    # Windows bind mount. Production uses a relative symlink (docs/hosting-websupport.md).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
    }

    location /build/ {
        access_log off;
        expires 1y;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
