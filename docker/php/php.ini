; Local development overrides (production memory_limit on Websupport is 512M)
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = Europe/Bratislava
expose_php = Off

; pcov for code coverage
pcov.enabled = 1
pcov.directory = /var/www/html/app

; opcache: revalidate on every request, code is edited live
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
